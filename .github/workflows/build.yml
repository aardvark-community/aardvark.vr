name: Build

on: 
  push:
    paths-ignore:
    - 'README.md'
    - 'docs/'
  pull_request:
    paths-ignore:
    - 'README.md'
    - 'docs/'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Build
      run: .\build.cmd
